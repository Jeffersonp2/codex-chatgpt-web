name: TEAMSIX AI Bridge CI

on:
  push:
    branches:
      - feature/teamsix-ai-bridge
    paths:
      - 'teamsix-ai-bridge/**'
      - '.github/workflows/teamsix-ai-bridge.yml'
  pull_request:
    paths:
      - 'teamsix-ai-bridge/**'
      - '.github/workflows/teamsix-ai-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: teamsix-ai-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:win
      - name: Smoke standalone Windows executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\teamsix-ai-bridge.exe' -PassThru -WindowStyle Hidden
          try {
            $models = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $models = Invoke-RestMethod 'http://127.0.0.1:11436/v1/models' -TimeoutSec 3
                break
              } catch {}
            }
            if (-not $models -or -not $models.data -or $models.data.Count -lt 1) {
              throw 'Compiled TEAMSIX provider did not answer /v1/models'
            }
            $models.data | Select-Object id, owned_by | Format-Table -AutoSize
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: teamsix-ai-bridge-windows-x64
          path: teamsix-ai-bridge/dist/teamsix-ai-bridge.exe
          if-no-files-found: error
